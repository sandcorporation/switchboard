# Checks for pull requests. On main pushes promote.yml calls this workflow (workflow_call) before promoting.
# Security: GitHub-hosted runners only, no pull_request_target, no secrets, read-only token.
#
# Time and skips (#339):
#   docs-only PR   a pull request that changes only *.md and docs/** skips every test step (scripts/ci/docs_only.sh);
#                  test and windows still report, green, under their names (required checks).
#   timeouts       job test 10 min, windows 20 min (about twice the usual run); go test -timeout 8m / 12m.
#   single test    30 s on Linux, 60 s on Windows (scripts/ci/test_budget.sh); tests already over the budget are
#                  listed in scripts/ci/test_budget_allow.txt until #340.
#   exp/ branches a pull request from an exp/ branch fails test at its first step (#540); no automatic factory opens PRs from exp/.
#   main pushes    promote.yml reuses this workflow's pull request run on the same git tree (scripts/ci/reuse.sh).
name: CI
on:
  push:
    branches: [work]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# A new commit on a pull request cancels that pull request's older run (#272).
# Every other run gets a group of its own and is never cancelled: a work push,
# a manual run, and promote.yml's check (under workflow_call github.event_name
# and github.workflow are the caller's, "push" and "promote", so it lands in
# ci-promote-<run_id>, which promote.yml never uses).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse pull requests from exp/ branches (#540)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            exp/*)
              echo "::error::exp/ 갈래는 실험용이라 병합하지 않는다 — 운영에 들이기로 정해졌으면 평소 갈래에서 PR 을 다시 낸다"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
      - name: Scope (docs-only pull requests skip the tests)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/docs_only.sh scope
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux (terminal backend tests)
        if: steps.scope.outputs.docs_only != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux && tmux -V
      - name: Question source of truth (server e2e)
        if: steps.scope.outputs.docs_only != 'true'
        run: bash scripts/ci/question_sot.sh
      - name: Answered rule golden (bump mail.AnsweredRuleVersion on change)
        if: steps.scope.outputs.docs_only != 'true'
        run: bash scripts/ci/answered_golden.sh
      - name: Hosting end to end (up, tmux)
        if: steps.scope.outputs.docs_only != 'true'
        run: bash scripts/ci/e2e.sh
      - name: tmux backend against real tmux
        if: steps.scope.outputs.docs_only != 'true'
        env:
          SWITCHBOARD_TEST_TMUX: require
        run: go test -count=1 -v ./internal/term/tmux/
      # promote.yml's reuse and release.yml look for this step name (scripts/ci/reuse.sh).
      - name: Go tests (all packages)
        if: steps.scope.outputs.docs_only != 'true'
        env:
          SWITCHBOARD_TEST_TMUX: require
          # The dashboard's Markdown renderer tests run under node (preinstalled on the runner).
          SWITCHBOARD_TEST_NODE: require
        run: |
          rc=0; go test -json -timeout 8m ./... >"$RUNNER_TEMP/go-test.json" || rc=$?
          bash scripts/ci/test_budget.sh 30 "$RUNNER_TEMP/go-test.json" || rc=1
          exit $rc
      - run: go vet ./...
        if: steps.scope.outputs.docs_only != 'true'
      - run: go build ./cmd/switchboard
        if: steps.scope.outputs.docs_only != 'true'
      - run: GOOS=windows go build ./... && GOOS=windows go vet ./...
        if: steps.scope.outputs.docs_only != 'true'
      - name: CI script tests
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          bash scripts/ci/promote_test.sh
          bash scripts/ci/reuse_test.sh
          bash scripts/ci/docs_only_test.sh
          bash scripts/ci/test_budget_test.sh
      - run: bash scripts/go_test.sh
        if: steps.scope.outputs.docs_only != 'true'
  plugin:
    # The agent plugin the CLI carries (#477, internal/agent/claude/plugin): core, adapter and panel
    # tests (`claude plugin test`), the MCP server tests (node --test), and the question path e2e
    # against the server built from this commit. A suite that runs no tests fails.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scope (docs-only pull requests skip the tests)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/docs_only.sh scope
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 24
      - name: Plugin test runner
        if: steps.scope.outputs.docs_only != 'true'
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.330
      - name: Plugin tests (mod)
        if: steps.scope.outputs.docs_only != 'true'
        run: bash internal/agent/claude/plugin/e2e/suite.sh mod
      - name: Plugin tests (MCP server)
        if: steps.scope.outputs.docs_only != 'true'
        run: bash internal/agent/claude/plugin/e2e/suite.sh mcp
      - name: Plugin install through the real CLI (scratch CLAUDE_CONFIG_DIR)
        if: steps.scope.outputs.docs_only != 'true'
        env:
          SWITCHBOARD_TEST_CLAUDE: require
        run: go test -count=1 -v -run '^TestInstallPluginWithClaudeCode$' ./internal/agent/claude/
      - name: Plugin question path e2e (this commit's server)
        if: steps.scope.outputs.docs_only != 'true'
        run: bash internal/agent/claude/plugin/e2e/run.sh
  windows:
    # ConPTY backend and keeper against real Windows. The ConPTY output of
    # each golden scene is uploaded as the conpty-recordings artifact (the
    # source of internal/term/testdata/conpty).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scope (docs-only pull requests skip the tests)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/docs_only.sh scope
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: ConPTY backend and keeper
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: go test -count=1 -v ./internal/term/conpty/ -args -conpty.record="$RUNNER_TEMP/conpty"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.docs_only != 'true'
        with:
          name: conpty-recordings
          path: ${{ runner.temp }}/conpty
          if-no-files-found: ignore
      - name: Hosting end to end (up, ConPTY keeper)
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: bash scripts/ci/e2e.sh
      - name: Question source of truth (server e2e)
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: bash scripts/ci/question_sot.sh
      # Every internal package (the server suite included, #206); the
      # TestE2E_ steps ran in e2e.sh above.
      # promote.yml's reuse looks for this step name (scripts/ci/reuse.sh).
      - name: Server and domain tests
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          rc=0; go test -json -count=1 -timeout 12m -skip '^TestE2E_' ./internal/... >"$RUNNER_TEMP/go-test.json" || rc=$?
          bash scripts/ci/test_budget.sh 60 "$RUNNER_TEMP/go-test.json" || rc=1
          exit $rc
      - run: go build ./...
        if: steps.scope.outputs.docs_only != 'true'
      - run: go vet ./...
        if: steps.scope.outputs.docs_only != 'true'
